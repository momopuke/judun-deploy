name: Verify approved JUDUN homepage and site health
on:
  push:
    paths:
      - ".github/workflows/probe-live.yml"
      - "channel/stable.json"
      - "channel/stable.json.sig.b64"
  workflow_dispatch:
permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Verify restored brand homepage, working entry points and production integrity
        shell: bash
        run: |
          python3 - <<'PY'
          import json, re, time, urllib.error, urllib.request
          from html.parser import HTMLParser

          BASE = "https://judun.142-93-91-214.sslip.io"

          def request(path):
              error = None
              for attempt in range(3):
                  try:
                      started = time.monotonic()
                      req = urllib.request.Request(BASE + path, headers={"Cache-Control": "no-cache", "User-Agent": "JUDUN-home-regression/1"})
                      with urllib.request.urlopen(req, timeout=30) as response:
                          body = response.read()
                      return round(time.monotonic() - started, 3), body
                  except (urllib.error.URLError, TimeoutError) as exc:
                      error = exc
                      if attempt < 2:
                          time.sleep(3)
              raise RuntimeError(f"GET {path} failed: {error}")

          def get_json(path):
              sec, raw = request(path)
              return sec, json.loads(raw.decode("utf-8"))

          class Home(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = []
                  self.links = []
              def handle_starttag(self, tag, attrs):
                  data = dict(attrs)
                  if "id" in data:
                      self.ids.append(data["id"])
                  if tag == "a":
                      self.links.append(data.get("href", ""))

          homepage_seconds, raw = request("/")
          homepage = raw.decode("utf-8")
          home = Home()
          home.feed(homepage)
          assert "居盾" in homepage, "Brand name is missing"
          assert "用專業" in homepage, "Previously approved homepage hero text was replaced"
          assert len(home.ids) == len(set(home.ids)), "Duplicate HTML IDs"
          assert "fileInput" in home.ids, "Existing upload file input is missing"
          assert "dataConsentInput" in home.ids, "Upload consent input is missing"
          print("APPROVED_HOME", json.dumps({
              "seconds": homepage_seconds,
              "ids": len(home.ids),
              "upload_file_input": "fileInput" in home.ids,
              "consent_input": "dataConsentInput" in home.ids
          }, ensure_ascii=False))

          for path in ("/matching/", "/matching/?role=company", "/cooperation/"):
              sec, body = request(path)
              assert body, f"Empty route: {path}"
              print("ROUTE_OK", path, sec)

          # The release channel is signed and GitHub-published, but the VPS
          # can lag behind it. A green health check alone is not deployment.
          import base64, hashlib, os, subprocess, tempfile
          from pathlib import Path

          root_url = ("https://raw.githubusercontent.com/" +
                      os.environ["GITHUB_REPOSITORY"] + "/" +
                      os.environ["GITHUB_SHA"] + "/")

          def immutable_resource(path, max_bytes):
              req = urllib.request.Request(root_url + path, headers={"Cache-Control": "no-cache"})
              with urllib.request.urlopen(req, timeout=25) as response:
                  payload = response.read(max_bytes + 1)
              assert 0 < len(payload) <= max_bytes, f"Invalid signed resource size: {path}"
              return payload

          signed_manifest_bytes = immutable_resource("channel/stable.json", 8192)
          signed_channel = json.loads(signed_manifest_bytes)
          public_key = immutable_resource("keys/release_signing_public.pem", 4096)
          assert hashlib.sha256(public_key).hexdigest() == (
              "17c8b563d224568447c3af1db57c8bb9ce51dbeac6c21371e909bc3a5635a8db"
          ), "Signing trust root changed"
          sig_b64 = immutable_resource("channel/stable.json.sig.b64", 1024)
          signature = base64.b64decode(b"".join(sig_b64.split()), validate=True)
          assert len(signature) == 64, "Invalid Ed25519 signature length"
          with tempfile.TemporaryDirectory() as td:
              folder = Path(td)
              (folder / "manifest").write_bytes(signed_manifest_bytes)
              (folder / "signature").write_bytes(signature)
              (folder / "public.pem").write_bytes(public_key)
              verified = subprocess.run([
                  "openssl", "pkeyutl", "-verify", "-pubin",
                  "-inkey", str(folder / "public.pem"), "-rawin",
                  "-in", str(folder / "manifest"), "-sigfile", str(folder / "signature")
              ], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, timeout=15, check=False)
          assert verified.returncode == 0, "Signed channel Ed25519 verification failed"
          payload_path = signed_channel.get("payload_path", "")
          assert re.fullmatch(r"releases/[A-Za-z0-9._-]+\\.cms\\.b64", payload_path), (
              "Unsafe CMS path"
          )
          cms_encoded = immutable_resource(payload_path, 30000000)
          cms_binary = base64.b64decode(b"".join(cms_encoded.split()), validate=True)
          assert 0 < len(cms_binary) <= 20000000, "Invalid CMS payload length"
          assert hashlib.sha256(cms_binary).hexdigest() == signed_channel.get("payload_sha256"), (
              "Encrypted release payload SHA mismatch"
          )
          print("CHANNEL_SIGNATURE_AND_CMS_SHA_PASS", signed_channel["release_id"])

          expected_version = str(signed_channel["expected_display_version"]).lstrip("v")
          expected_artifact = str(signed_channel["target_artifact_id"])
          assert expected_artifact.startswith("JUDUN-"), "Invalid channel target"

          # The original VPS pull timer checks GitHub once a minute.
          # A new signed release can be published before the agent installs it.
          # Wait briefly for the exact target; never approve stale production.
          deadline = time.monotonic() + 180
          while True:
              _, build = get_json("/health/build")
              version = str(build.get("version") or build.get("display_version") or "").lstrip("v")
              artifact_id = build.get("artifact_id", "")
              if version == expected_version and artifact_id == expected_artifact:
                  break
              if time.monotonic() >= deadline:
                  raise AssertionError(
                      "SIGNED_RELEASE_NOT_INSTALLED: published=" + expected_version + " / " + expected_artifact +
                      "; live=" + version + " / " + str(artifact_id))
              print("WAIT_FOR_SIGNED_DEPLOY", json.dumps({
                  "expected": expected_version, "live": version, "artifact": artifact_id
              }))
              time.sleep(10)
          match = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)", version)
          assert match, f"Invalid version: {version}"
          assert tuple(map(int, match.groups())) >= (1, 2, 111), f"Pre-restoration deployment detected: {version}"
          artifact_id = build.get("artifact_id", "")
          assert artifact_id.startswith("JUDUN-"), f"Missing artifact ID: {build}"
          print("SIGNED_RELEASE_LIVE_IDENTITY_PASS", expected_version, expected_artifact)

          _, integrity = get_json("/health/artifact?deep=true")
          assert integrity.get("status") == "ok", integrity
          assert integrity.get("artifact_id") == artifact_id, "Live build and artifact differ"
          assert integrity.get("mismatch_count", 0) == 0, integrity
          verified = int(integrity.get("files_verified") or 0)
          assert verified >= 79, f"Managed file count dropped: {verified}"
          expected = integrity.get("manifest_file_count")
          if expected is not None:
              assert verified == int(expected), f"Partial verification: {verified}/{expected}"

          _, ready = get_json("/health/ready")
          assert ready.get("status") == "ready", "Production preflight is not ready"
          assert ready.get("version") == version, "Readiness version differs"
          print("PRODUCTION_READY_PASS", json.dumps({"version": version, "ready": ready["status"]}))

          if tuple(map(int, match.groups())) >= (1, 2, 133):
              from urllib.error import HTTPError
              try:
                  request("/admin/preflight")
              except RuntimeError as err:
                  assert "HTTP Error 401" in str(err), "Admin endpoint must refuse anonymous access"
                  print("ADMIN_UNAUTHENTICATED_REFUSAL_PASS")
              else:
                  raise AssertionError("Admin endpoint unexpectedly permitted anonymous access")

          _, excluded = get_json("/health/source-exclusion")
          assert excluded.get("remaining_cases") == 0, excluded
          assert excluded.get("remaining_records") == 0, excluded

          print("APPROVED_HOME_LIVE_GUARD_PASS", json.dumps({
              "version": version,
              "artifact_id": artifact_id,
              "files_verified": verified,
              "source_exclusion_cases": excluded["remaining_cases"],
              "source_exclusion_records": excluded["remaining_records"],
              "status": "approved design and routing smoke check"
          }, ensure_ascii=False))
          PY
# Recheck production baseline for signed release prep 2026-10-23
# Post-release read-only production identity probe for v1.2.133 2026-10-23
# v1.2.133 post-release read-only check 2026-10-23 12:05 UTC
