name: R13 public dependencies wheelhouse (no product code)
on:
  push:
    branches:
      - ci/p0-19-r13-public-wheels-20261115
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wheels:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download official pinned dependencies for CPython 3.13 x86_64
        shell: bash
        run: |
          set -euo pipefail
          python -V
          uname -m
          mkdir -p wheelhouse
          python -m pip download --index-url https://pypi.org/simple --only-binary=:all: --dest wheelhouse 'nh3==0.3.7' 'google-genai==2.19.0' 'fastapi==0.141.1' 'uvicorn==0.52.4' 'sqlalchemy==2.0.52' 'python-dotenv==1.2.3' 'pydantic==2.13.4' 'requests==2.34.2' 'python-multipart==0.0.32' 'Pillow>=10.4,<13' 'pillow-heif>=0.18,<2' 'xlrd>=2.0.1,<3' 'weasyprint==70.0' 'beautifulsoup4==4.14.3' 'chromadb==1.5.9'
          (cd wheelhouse && sha256sum *.whl | sort -k2 > SHA256SUMS.txt)
          python - <<'PY'
          import glob,sys
          files=glob.glob('wheelhouse/*.whl')
          print('OFFICIAL_WHEELHOUSE_READY',len(files),'wheels')
          print('PYTHON',sys.version)
          PY
      - name: Upload public third-party wheels only
        uses: actions/upload-artifact@v4
        with:
          name: r13-official-cp313-linux-x64-wheels
          path: wheelhouse/
          if-no-files-found: error
          retention-days: 3
