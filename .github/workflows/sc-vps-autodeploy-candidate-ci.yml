name: SC VPS signed auto-deploy release QA (no server access)
on:
  push:
    branches: [vps-maintenance]
    paths:
      - 'vps-maintenance/autodeploy/**'
      - 'vps-maintenance/autodeploy/channel.json'
      - 'vps-maintenance/autodeploy/channel.sig.b64'
      - '.github/workflows/sc-vps-autodeploy-candidate-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline_audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify signed channel, source hashes, pinned bootstrap, and code syntax
        shell: bash
        run: |
          set -euo pipefail
          cd vps-maintenance/autodeploy
          python3 -m py_compile review/pull_agent_v5.py
          python3 review/pull_agent_v5.py --check
          bash -n review/bootstrap_v5.sh
          base64 -d channel.sig.b64 >/tmp/sc-vps.sig
          openssl pkeyutl -verify -pubin -inkey release-signing-public.pem -rawin -in channel.json -sigfile /tmp/sc-vps.sig
          python3 - <<'PY'
          import hashlib, json, pathlib, re
          root=pathlib.Path('.')
          m=json.loads((root/'channel.json').read_text())
          assert m['schema']=='sc-vps-signed-release/v1'
          assert m['sequence']==3 and m['operation']=='apply'
          assert m['git_commit']=='59d1f4b37f20457c071600e797d2c43369d46a6b'
          for n,digest in m['files'].items():
              p=root/'releases'/m['release_id']/n
              assert p.is_file(), n
              assert hashlib.sha256(p.read_bytes()).hexdigest()==digest, n
          agent=(root/'review/pull_agent_v5.py').read_bytes()
          shell=(root/'review/bootstrap_v5.sh').read_text()
          sha=hashlib.sha256(agent).hexdigest()
          assert "AGENT_SHA256='"+sha+"'" in shell
          assert 'TimeoutStartSec=900s' in shell
          assert 'SIGNED_READ_ONLY_STATUS_PASS' in shell
          assert shell.index('systemctl start sc-vps-autodeploy.service') < shell.index('systemctl enable --now sc-vps-autodeploy.timer')
          assert 'FIRST_RELEASE_MUST_BE_READ_ONLY_STATUS' in agent.decode()
          assert 'UNRESOLVED_PREVIOUS_RELEASE_REQUIRES_RECONCILIATION' in agent.decode()
          print('SC_VPS_OFFLINE_SIGNED_CANDIDATE_PASS')
          PY
      - name: Run five rounds of signed v10 safety tests (never deploy)
        shell: bash
        run: |
          set -euo pipefail
          cd vps-maintenance/autodeploy/releases/SC-VPS-v10-20261104-a1
          for n in 1 2 3 4 5; do
              PYTHONPATH=. PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p test_v10.py -q
              echo "v10 local round $n PASS"
          done
          echo 'VPS_SERVER_NOT_ACCESSED'
      - name: Five rounds of v5 signed-agent fail-closed tests (never deploy)
        shell: bash
        run: |
          set -euo pipefail
          cd vps-maintenance/autodeploy/review
          for n in 1 2 3 4 5; do
              PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s . -p test_pull_agent_v5.py -q
              echo "v5 signing and watchdog round $n PASS"
          done

      - name: Official published agent contract QA (not just review candidate)
        shell: bash
        run: |
          set -euo pipefail
          cd vps-maintenance/autodeploy
          python3 -m py_compile pull_agent.py
          python3 pull_agent.py --check
          bash -n bootstrap.sh
          python3 - <<'PY'
          import hashlib,pathlib,re,json
          root=pathlib.Path('.')
          source=(root/'pull_agent.py').read_bytes()
          shell=(root/'bootstrap.sh').read_text()
          digest=hashlib.sha256(source).hexdigest()
          assert "AGENT_SHA256='"+digest+"'" in shell
          assert 'TimeoutStartSec=900s' in shell
          assert shell.index('systemctl start sc-vps-autodeploy.service') < shell.index('systemctl enable --now sc-vps-autodeploy.timer')
          assert 'FIRST_RELEASE_MUST_BE_READ_ONLY_STATUS' in source.decode()
          assert 'UNRESOLVED_PREVIOUS_RELEASE_REQUIRES_RECONCILIATION' in source.decode()
          assert 'TARGET_PARENT_UNSAFE' in source.decode()
          assert json.loads((root/'channel.json').read_text())['operation']=='apply'
          print('OFFICIAL_SC_VPS_PINNED_AGENT_QA_PASS')
          PY
          for n in 1 2 3 4 5; do
            PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s . -p test_pull_agent.py -q
            PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s . -p test_signed_channel.py -q
            echo "official signed agent QA round $n PASS"
          done
          echo 'NO_VPS_DEPLOYMENT_PERFORMED'

      - name: Reconcile existing/partial enrollment without touching production
        shell: bash
        run: |
          set -euo pipefail
          cd vps-maintenance/autodeploy/review
          echo 'a83e22704c4629b988b37cb2b37625eb4bbdd5922daf51cf56edec08b10710df  reconcile_v1.py' | sha256sum -c -
          python3 -m py_compile reconcile_v1.py
          python3 reconcile_v1.py --self-test
          for i in 1 2 3 4 5; do
            python3 -m unittest discover -s . -p test_reconcile_v1.py -q
          done
          echo '100_SC_VPS_RECONCILIATION_TESTS_PASS_OFFLINE_ONLY'

      - name: Existing-install v2 semantic-only reconciliation tests (no VPS access)
        shell: bash
        run: |
          set -euo pipefail
          cd vps-maintenance/autodeploy/review
          echo 'c787f34a21e101881233a2e0d4c64fc4955488f7a9992bbc21714b296c27c50c  reconcile_v2.py' | sha256sum -c -
          echo '47df75545207f39d144228a019e5c6fb5278062d3bc9bd6df6072dac8da9d965  test_reconcile_v2.py' | sha256sum -c -
          python3 -m py_compile reconcile_v2.py
          python3 reconcile_v2.py --self-test
          for i in 1 2 3 4 5; do
            python3 -m unittest discover -s . -p 'test_reconcile_v*.py' -q
            echo "Reconciliation round $i PASS"
          done
          echo 'SC_VPS_OFFLINE_150_ASSERTIONS_PASS'

      - name: Exact known-260s host regression and guarded migration v3
        shell: bash
        run: |
          set -euo pipefail
          cd vps-maintenance/autodeploy/review
          echo '9983d7e08277372430bc411bf494b4ff912cf753ae1b462610961c785e40957e  reconcile_v3.py' | sha256sum -c -
          echo 'ff870f550d539cb36228ca337e0e144e0b5c156c7045804434c4cd812748cb0e  test_reconcile_v3.py' | sha256sum -c -
          python3 -m py_compile reconcile_v3.py
          python3 reconcile_v3.py --self-test
          for i in 1 2 3 4 5; do
            python3 -m unittest discover -s . -p test_reconcile_v3.py -q
            echo "v3 guarded timeout/legacy migration round $i PASS"
          done
          echo '195/195 LOCAL_ONLY; NO_VPS_EXECUTION'

      - name: Verified legacy sequence-1 recovery v4 (no VPS actions)
        shell: bash
        run: |
          set -euo pipefail
          cd vps-maintenance/autodeploy/review
          echo '2cef3b74220347a6d33128183f3b99e08b0abb49545ae136fa8d6c0081998051  reconcile_v4.py' | sha256sum -c -
          echo 'f83ba06033fc3d7b4b2ec6ae49e5e614fd1f40e2dcd284b97fa07688d1283484  test_legacy_v4.py' | sha256sum -c -
          echo '1e0aaffe40cad4284ba9283a81967835f4c86ab06951d864b5513042e23d7b30  test_reconcile_v4.py' | sha256sum -c -
          python3 -m py_compile reconcile_v4.py
          python3 reconcile_v4.py --self-test
          for i in 1 2 3 4 5; do
            python3 -m unittest discover -s . -p 'test_*v4.py' -q
            echo "signed legacy-status migration round $i PASS"
          done
          echo '345_LOCAL_REGRESSION_TESTS_PASS; VPS_NOT_TOUCHED'

      - name: Guarded legacy diagnosis-only recovery v5 (no host access)
        shell: bash
        run: |
          set -euo pipefail
          cd vps-maintenance/autodeploy/review
          echo '7cafdeccee1ef3deab269399d840f85d988eb642e1f70bb219c802c2cc09c332  reconcile_v5.py' | sha256sum -c -
          echo 'bbe9bdb693e971d962482c197ac49bbb63e59a9f91a5b4e87743b205c0b367c4  test_refusal_v5.py' | sha256sum -c -
          echo '90b4ca6879e7214b1083908d3c2cfc470bca26b7ad12c804cd833e45fc25f8e6  test_watchdogs_v5.py' | sha256sum -c -
          python3 -m py_compile reconcile_v5.py
          python3 reconcile_v5.py --self-test
          for i in 1 2 3 4 5; do
            PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s . -p 'test_*v5.py' -q
            echo "v5 guarded legacy refusal round $i PASS"
          done
          echo '590_V5_TESTS_LOCAL_ONLY; VPS_NOT_ACCESSED'

      - name: Signed seq-2 updater migration v6 pinned and 5x34 simulation tests
        shell: bash
        run: |
          set -euo pipefail
          cd vps-maintenance/autodeploy/review
          echo 'e3b8fe3a870976269d7a5cde60b2280638da8d02a7c1e688146dc39da5135576  activate_seq2_v6.py' | sha256sum -c -
          echo '188753d10587a2aa5d9d6595de26d551ada7b84daa5ef3eeb032a4e89b4a6b96  test_activate_seq2_v6.py' | sha256sum -c -
          python3 -m py_compile activate_seq2_v6.py
          python3 activate_seq2_v6.py --self-test
          for i in 1 2 3 4 5; do
            PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s . -p test_activate_seq2_v6.py -q
            echo "Signed read-only seq-2 v6 migration round $i PASS"
          done
          echo '170_LOCAL_TESTS_PASS; VPS_NOT_TOUCHED_BY_CI'
