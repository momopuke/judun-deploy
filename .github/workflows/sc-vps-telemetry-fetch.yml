name: SC VPS read encrypted host receipts (no SSH)
on:
  push:
    branches: [vps-maintenance]
    paths:
      - 'vps-maintenance/autodeploy/channel.json'
      - '.github/workflows/sc-vps-telemetry-fetch.yml'
      - 'vps-maintenance/autodeploy/telemetry-poll-trigger.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-host:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read bounded encrypted receipts, prefer V15 authenticated-key format
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast,base64,json,pathlib,re,time,urllib.request
          src=pathlib.Path('vps-maintenance/autodeploy/releases/SC-VPS-v15-20261104-e1/SC_VPS_Rescue_v15.py').read_text()
          uplink=next(ast.literal_eval(n.value) for n in ast.parse(src).body
                      if isinstance(n,ast.Assign) and any(getattr(t,'id',None)=='UPLINK' for t in n.targets))
          assert re.fullmatch(r'https://ntfy\.sh/scvps-rpt-[0-9a-f]{40}',uplink)
          req=urllib.request.Request(uplink+'/json?poll=1&since=1h',headers={'User-Agent':'SCVPS-receiver-v15/1'})
          with urllib.request.urlopen(req,timeout=25) as resp:
              raw=resp.read(200000)
          candidates=[]
          for row in raw.decode('utf8').splitlines():
              try:
                  item=json.loads(row)
                  msg=item.get('message','')
                  epoch=int(item.get('time',0))
                  if item.get('event')!='message' or not isinstance(msg,str) or len(msg)!=684:continue
                  if len(base64.b64decode(msg,validate=True))!=512:continue
                  if abs(time.time()-epoch)>43200:continue
                  candidates.append((epoch,item.get('title',''),msg))
              except (ValueError,TypeError,KeyError,AssertionError):continue
          if not candidates:raise SystemExit('NO_LIVE_HOST_ENCRYPTED_REPORT')
          v16=[i for i in candidates if i[1]=='SC VPS encrypted metrics v16']
          v15=[i for i in candidates if i[1]=='SC VPS encrypted metrics v15']
          # The v16 uploader inherits the v15 title: inspect the actual decrypted
          # payload version instead of trusting the public relay title.
          rec=max(candidates,key=lambda x:x[0])
          recent=sorted(candidates,key=lambda x:x[0],reverse=True)[:24]
          print('V16_TITLE_AVAILABLE='+str(bool(v16)))
          print('V15_TITLE_AVAILABLE='+str(bool(v15)))
          print('HOST_RECEIPT_TIME_UNIX='+str(rec[0]))
          print('HOST_RECEIPT_TITLE='+str(rec[1])[:90])
          print('HOST_ENCRYPTED_REPORT_B64='+rec[2])
          print('HOST_RECENT_COUNT='+str(len(recent)))
          for idx,(epoch,title,msg) in enumerate(recent,1):
              print('HOST_RECENT_'+str(idx)+'_TIME_UNIX='+str(epoch))
              print('HOST_RECENT_'+str(idx)+'_TITLE='+str(title)[:90])
              print('HOST_RECENT_'+str(idx)+'_ENCRYPTED_REPORT_B64='+msg)
          print('ENCRYPTED_RECEIPT_READ_PASS')
          PY
