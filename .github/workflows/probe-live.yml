name: Probe live JUDUN
on:
  push:
    paths:
      - ".github/workflows/probe-live.yml"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Measure expansion status response without changing production
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures,json,time,urllib.request
          base="https://judun.142-93-91-214.sslip.io"
          paths=["/admin/data-expansion/api/status","/health/build","/health/source-exclusion"]
          def check(path):
            started=time.monotonic()
            try:
              with urllib.request.urlopen(urllib.request.Request(base+path,headers={"Cache-Control":"no-cache"}),timeout=85) as response:
                data=json.load(response)
              if path.endswith("/api/status"):
                data={"running":data.get("running"),"control":data.get("control"),"baseline":data.get("baseline"),"auto_goal":{key:(data.get("auto_goal") or {}).get(key) for key in ["status","task_id","rounds_completed","formal_added_total"]}}
              if path=="/health/build":data={key:data.get(key) for key in ["version","artifact_id","manifest_status","concurrency"]}
              return {"path":path,"seconds":round(time.monotonic()-started,3),"data":data}
            except Exception as exc:return {"path":path,"seconds":round(time.monotonic()-started,3),"error":str(exc)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:
            for result in pool.map(check,paths):print(json.dumps(result,ensure_ascii=False))
          PY
