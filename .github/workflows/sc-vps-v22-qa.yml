name: SC VPS v22 rotated-key guard QA (never deploy)
on:
  push:
    branches: [vps-maintenance]
    paths:
      - 'vps-maintenance/autodeploy/releases/SC-VPS-v22-20261114-h1/**'
      - 'vps-maintenance/autodeploy/channel.json'
      - '.github/workflows/sc-vps-v22-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v22-offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run five independent rounds with genuine v15 v16 v17 dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd vps-maintenance/autodeploy/releases/SC-VPS-v22-20261114-h1
          python3 -m py_compile SC_VPS_Rescue_v22.py SC_VPS_Rescue_v15.py SC_VPS_Rescue_v16.py SC_VPS_Rescue_v17.py tests/test_v22.py
          for i in 1 2 3 4 5; do
            PYTHONPATH="$PWD" python3 -m unittest discover -s tests -p test_v22.py -q
          done
      - name: Check immutable manifest signature and all hashes after publish
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,pathlib,subprocess,tempfile
          root=pathlib.Path('vps-maintenance/autodeploy')
          raw=(root/'channel.json').read_bytes()
          doc=json.loads(raw)
          if doc['sequence']!=22:
              print('STAGING_V22_TESTS_ONLY');raise SystemExit(0)
          assert doc['version']==22 and doc['operation']=='apply' and doc['release_id']=='SC-VPS-v22-20261114-h1'
          assert doc['git_commit']=='7b11f454f4c5f233a277dcfbd425f4ede5ed35bb'
          src=root/'releases'/doc['release_id']
          for name,want in doc['files'].items():
              assert hashlib.sha256((src/name).read_bytes()).hexdigest()==want,name
          with tempfile.TemporaryDirectory() as td:
              sig=pathlib.Path(td)/'sig'
              sig.write_bytes(base64.b64decode((root/'channel.sig.b64').read_text().strip(),validate=True))
              subprocess.run(['openssl','pkeyutl','-verify','-pubin','-inkey',str(root/'release-signing-public.pem'),
                              '-rawin','-in',str(root/'channel.json'),'-sigfile',str(sig)],check=True,capture_output=True)
          print('SIGNED_V22_QA_PASS')
          PY
