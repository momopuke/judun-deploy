name: Verify JUDUN v1.2.85 signed release

on:
  push:
    paths:
      - ".github/workflows/verify-v1285-live.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Verify signed channel and encrypted payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json
          from pathlib import Path
          m=json.loads(Path("channel/stable.json").read_text())
          assert m["release_id"]=="v1.2.85-report-links-r1-20261005",m
          assert m["base_artifact_id"]=="JUDUN-1.2.84-3D98B45C9227",m
          assert m["target_artifact_id"]=="JUDUN-1.2.85-19A955700B55",m
          assert m["target_build_instance_id"]=="1.2.85-20261005-57FBA1B1CB56",m
          raw=base64.b64decode("".join(Path(m["payload_path"]).read_text().split()))
          got=hashlib.sha256(raw).hexdigest()
          print("payload_sha_expected",m["payload_sha256"])
          print("payload_sha_actual  ",got)
          assert got==m["payload_sha256"]
          PY
          base64 -d channel/stable.json.sig.b64 > /tmp/stable.sig
          openssl pkeyutl -verify -pubin -inkey keys/release_signing_public.pem -rawin -in channel/stable.json -sigfile /tmp/stable.sig
          echo "SIGNED_RELEASE_VERIFY_PASS"

      - name: Best-effort production probe
        shell: bash
        run: |
          BASE="https://judun.142-93-91-214.sslip.io"
          if ! BUILD="$(curl -4 --http1.1 -fsS --connect-timeout 5 --max-time 15 -H 'Cache-Control: no-cache' "$BASE/health/build?probe=$(date +%s)")"; then
            echo "::warning::GitHub-hosted runner cannot currently reach production health endpoint. Signed release validation passed; this network probe is diagnostic only."
            exit 0
          fi
          echo "$BUILD"
          VERSION="$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("display_version",""))' <<<"$BUILD" 2>/dev/null || true)"
          ARTIFACT="$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("artifact_id",""))' <<<"$BUILD" 2>/dev/null || true)"
          if [[ "$VERSION" == "v1.2.85" && "$ARTIFACT" == "JUDUN-1.2.85-19A955700B55" ]]; then
            echo "Production reports v1.2.85."
          else
            echo "::warning::Production probe returned a different or unreadable build; AutoDeploy may still be converging."
          fi
