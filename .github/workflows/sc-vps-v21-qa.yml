name: SC VPS v21 corrected CPU guard QA (never deploy)
on:
  push:
    branches: [vps-maintenance]
    paths:
      - 'vps-maintenance/autodeploy/releases/SC-VPS-v21-20261114-g1/**'
      - 'vps-maintenance/autodeploy/channel.json'
      - '.github/workflows/sc-vps-v21-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v21-offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run five independent rounds against actual v15 dependency
        shell: bash
        run: |
          set -euo pipefail
          cd vps-maintenance/autodeploy/releases/SC-VPS-v21-20261114-g1
          python3 -m py_compile SC_VPS_Rescue_v21.py SC_VPS_Rescue_v15.py tests/test_v21.py
          for i in 1 2 3 4 5; do
            PYTHONPATH="$PWD" python3 -m unittest discover -s tests -p test_v21.py -q
          done
      - name: Verify signed v21 release when published
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,pathlib,subprocess,tempfile
          root=pathlib.Path('vps-maintenance/autodeploy')
          manifest=(root/'channel.json').read_bytes()
          doc=json.loads(manifest)
          if doc['sequence'] != 21:
              print('STAGING_V21_TESTS_ONLY');raise SystemExit(0)
          assert doc['version']==21 and doc['operation']=='apply'
          assert doc['release_id']=='SC-VPS-v21-20261114-g1'
          assert doc['git_commit']=='7707b7dbb8e29227308b37b1b9a9b80ccf4f45a0'
          folder=root/'releases'/doc['release_id']
          for name,expected in doc['files'].items():
              data=(folder/name).read_bytes()
              assert hashlib.sha256(data).hexdigest()==expected,name
          with tempfile.TemporaryDirectory() as temp:
              sig=pathlib.Path(temp)/'sig'
              sig.write_bytes(base64.b64decode((root/'channel.sig.b64').read_text().strip(),validate=True))
              subprocess.run(['openssl','pkeyutl','-verify','-pubin','-inkey',str(root/'release-signing-public.pem'),
                              '-rawin','-in',str(root/'channel.json'),'-sigfile',str(sig)],capture_output=True,check=True)
          print('SIGNED_V21_SOURCE_AND_QA_PASS')
          PY
