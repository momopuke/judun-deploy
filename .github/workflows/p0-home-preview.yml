name: JUDUN P0 homepage preview tests (no production changes)
on:
  push:
    paths:
      - "p0/**"
      - ".github/workflows/p0-home-preview.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install isolated browser test runner
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test temporary P0 entry layer against real public homepage
        run: node p0/preview-test.cjs
      - name: Upload before/after desktop and mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: judun-p0-homepage-visual-qa
          path: p0/results/*.png
          if-no-files-found: ignore
          retention-days: 14
