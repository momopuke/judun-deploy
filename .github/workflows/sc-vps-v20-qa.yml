name: SC VPS v20 bounded CPU attribution tests (never deploy)
on:
  push:
    branches: [vps-maintenance]
    paths:
      - 'vps-maintenance/autodeploy/channel.json'
      - 'vps-maintenance/autodeploy/releases/SC-VPS-v20-20261114-f1/**'
      - '.github/workflows/sc-vps-v20-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v20-offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Five isolated rounds of v20 no-restart, fail-closed and prioritization tests
        shell: bash
        run: |
          set -euo pipefail
          cd vps-maintenance/autodeploy/releases/SC-VPS-v20-20261114-f1
          python3 -m py_compile SC_VPS_Rescue_v20.py SC_VPS_Rescue_v15.py tests/test_v20.py
          for i in 1 2 3 4 5; do
            PYTHONPATH="$PWD" python3 -m unittest discover -s tests -p test_v20.py -q
          done
      - name: Signed manifest and pinned source-integrity verification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,pathlib,subprocess,tempfile
          root=pathlib.Path('vps-maintenance/autodeploy')
          doc_bytes=(root/'channel.json').read_bytes()
          doc=json.loads(doc_bytes)
          assert doc['sequence']==20 and doc['version']==20 and doc['operation']=='apply'
          assert doc['release_id']=='SC-VPS-v20-20261114-f1'
          assert doc['git_commit']=='d5d5f37e960a028bfd8c09ffc71abd31a2a55563'
          folder=root/'releases'/doc['release_id']
          for name,expected in doc['files'].items():
              f=folder/name
              assert f.is_file() and hashlib.sha256(f.read_bytes()).hexdigest()==expected,name
          with tempfile.TemporaryDirectory() as temporary:
              signature=pathlib.Path(temporary)/'signature'
              signature.write_bytes(base64.b64decode((root/'channel.sig.b64').read_text().strip(),validate=True))
              subprocess.run(['openssl','pkeyutl','-verify','-pubin','-inkey',str(root/'release-signing-public.pem'),
                              '-rawin','-in',str(root/'channel.json'),'-sigfile',str(signature)],check=True,capture_output=True)
          print('SIGNED_V20_SOURCE_AND_TEST_QA_PASS')
          PY
