name: Verify JUDUN signed release and production

on:
  push:
    paths:
      - ".github/workflows/verify-v1286-live.yml"
      - ".github/scripts/verify_release.py"
      - "channel/stable.json"
      - "channel/stable.json.sig.b64"
      - "releases/**"
  workflow_dispatch:

concurrency:
  group: judun-production-verification
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v5
      - name: Verify signed release channel and payload
        run: python3 .github/scripts/verify_release.py package
      - name: Verify production identity and all managed files
        run: python3 .github/scripts/verify_release.py live
      - name: Read-only live source identity for next signed delta
        run: |
          python3 - <<'PY'
          import json, urllib.request
          url='https://judun.142-93-91-214.sslip.io/health/build'
          request=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'JUDUN-v136-preflight/1'})
          with urllib.request.urlopen(request,timeout=30) as response:
              data=json.load(response)
          safe={key:data.get(key) for key in ('version','artifact_id','source_tree_sha256','build_instance_id','manifest_status')}
          print('LIVE_SOURCE_IDENTITY',json.dumps(safe,ensure_ascii=False,sort_keys=True))
          PY
# v1.2.133 signed release final live-base verification 2026-10-23
