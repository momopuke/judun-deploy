name: SC VPS read-only diagnostic tests (never deploy)
on:
  push:
    branches:
      - vps-maintenance
    paths:
      - 'vps-maintenance/diagnostic_v1.py'
      - 'vps-maintenance/test_diagnostic_v1.py'
      - '.github/workflows/sc-vps-diagnostic-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and five rounds of unit checks
        run: |
          python3 -m py_compile vps-maintenance/diagnostic_v1.py
          for i in 1 2 3 4 5; do
            python3 -m unittest discover -s vps-maintenance -p 'test_diagnostic_v1.py' -q
          done
      - name: Independent local environment smoke test (not VPS)
        run: |
          python3 vps-maintenance/diagnostic_v1.py --sample 2 --print > /tmp/sc_vps_diagnostic_smoke.json
          python3 - <<'PY'
          import json
          v=json.load(open('/tmp/sc_vps_diagnostic_smoke.json'))
          assert v['schema']=='sc-vps-diagnostic/v1'
          assert v['stripchat_moderation_verified'] is False
          assert v['recording_verified'] is False
          print('LOCAL_SMOKE_PASS; VPS_NOT_TOUCHED')
          PY
