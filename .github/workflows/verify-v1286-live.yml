name: Verify JUDUN signed release and production

on:
  push:
    paths:
      - ".github/workflows/verify-v1286-live.yml"
      - ".github/scripts/verify_release.py"
      - "channel/stable.json"
      - "channel/stable.json.sig.b64"
      - "releases/**"
  workflow_dispatch:

concurrency:
  group: judun-production-verification
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Verify signed release channel and payload
        run: python3 .github/scripts/verify_release.py package
      - name: Verify production identity and all managed files
        run: python3 .github/scripts/verify_release.py live
