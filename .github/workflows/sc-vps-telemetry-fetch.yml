name: SC VPS fetch latest encrypted host report (no SSH)
on:
  push:
    branches: [vps-maintenance]
    paths:
      - 'vps-maintenance/autodeploy/channel.json'
      - '.github/workflows/sc-vps-telemetry-fetch.yml'
      - 'vps-maintenance/autodeploy/telemetry-poll-trigger.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-host:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - name: Receive current host report over outbound encrypted relay
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast,base64,json,pathlib,re,time,urllib.request
          src=pathlib.Path('vps-maintenance/autodeploy/releases/SC-VPS-v13-20261104-c1/SC_VPS_Rescue_v13.py').read_text()
          url=next(ast.literal_eval(n.value) for n in ast.parse(src).body
                   if isinstance(n,ast.Assign) and any(getattr(t,'id',None)=='UPLINK' for t in n.targets))
          assert re.fullmatch(r'https://ntfy\.sh/scvps-rpt-[0-9a-f]{40}',url)
          for attempt in range(24):
              try:
                  req=urllib.request.Request(url+'/json?poll=1&since=latest',headers={'User-Agent':'SCVPS-receiver/1'})
                  with urllib.request.urlopen(req,timeout=20) as res:
                      body=res.read(6000).decode('utf8')
                  for line in body.splitlines():
                      item=json.loads(line)
                      msg=item.get('message','')
                      if item.get('event')=='message' and isinstance(msg,str) and len(msg)==684:
                          assert len(base64.b64decode(msg,validate=True))==512
                          assert abs(time.time()-int(item.get('time',0)))<7200
                          print('V13_HOST_ENCRYPTED_REPORT_RECEIVED')
                          print('V13_RELAY_RECEIVED_UNIX='+str(item['time']))
                          print('V13_ENCRYPTED_REPORT_B64='+msg)
                          raise SystemExit(0)
              except (OSError,ValueError,KeyError,AssertionError) as e:
                  print('TELEMETRY_RETRY',attempt,type(e).__name__)
              if attempt<23:time.sleep(25)
          raise SystemExit('V13_HOST_REPORT_NOT_RECEIVED')
          PY
