name: Judun v192 encrypted staging candidate assembly
on:
  push:
    branches:
      - stage/v192-transfer-20261125-29a007c6329c
permissions:
  contents: write
jobs:
  assemble-stage-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Verify exact CMS chunks and original Ed25519 signature
        run: python3 stage-transfer/v192/assemble.py
      - name: Publish immutable signed stage-only candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE=3f0050a7333228419c0d72a74632a012b14df0cb
          BRANCH=stage/v192-candidate-20261125-29a007c6329c
          git fetch --no-tags origin refs/heads/main --depth=1
          test "$(git rev-parse FETCH_HEAD)" = "$BASE"
          if git ls-remote --exit-code --heads origin "refs/heads/$BRANCH" >/dev/null; then
            echo 'STOP:JUDUN_CANDIDATE_BRANCH_ALREADY_EXISTS'
            exit 1
          fi
          git switch --detach "$BASE"
          git switch -c "$BRANCH"
          mkdir -p staging
          cp "$RUNNER_TEMP/candidate.cms" staging/candidate.cms
          cp "$RUNNER_TEMP/candidate.json" staging/candidate.json
          cp "$RUNNER_TEMP/candidate.json.sig.b64" staging/candidate.json.sig.b64
          test "$(sha256sum staging/candidate.cms | cut -d' ' -f1)" = 5e4527e4623781583f5ca214b3bee2ebc6b64103cc4daf87f55a04d4d6033b0c
          git add staging/candidate.cms staging/candidate.json staging/candidate.json.sig.b64
          git -c user.name='judun-stage-ci' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Prepare v1.2.192 immutable signed encrypted staging candidate'
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "JUDUN_V192_SIGNED_STAGE_CANDIDATE_PUSH_PASS $(git rev-parse HEAD)"
