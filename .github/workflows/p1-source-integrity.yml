name: JUDUN P0 evidence integrity (read-only)
on:
  push:
    paths:
      - "p1/**"
      - ".github/workflows/p1-source-integrity.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify evidence quality policy regression
        run: python3 -m unittest discover -s p1 -p 'test_*.py' -v
      - name: Read-only public evidence health
        run: python3 p1/check_public_health.py
      - name: Save sanitized health evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: judun-source-trust-health
          path: p1/results/*.json
          if-no-files-found: ignore
          retention-days: 14
