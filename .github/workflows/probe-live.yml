name: Probe live JUDUN
on:
  push:
    paths:
      - ".github/workflows/probe-live.yml"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify excluded source removal and production integrity
        shell: bash
        run: |
          python3 - <<'PY'
          import json,urllib.request,concurrent.futures
          base="https://judun.142-93-91-214.sslip.io"
          paths=["/health/source-exclusion","/health/build","/health/artifact?deep=true"]
          def check(path):
            try:
              request=urllib.request.Request(base+path,headers={"Cache-Control":"no-cache"})
              with urllib.request.urlopen(request,timeout=80) as response:
                data=json.load(response)
                if path=="/health/build":
                  data={key:data.get(key) for key in ["status","version","display_version","artifact_id","build_signature","manifest_status"]}
                if path.startswith("/health/artifact"):
                  data={key:data.get(key) for key in ["status","artifact_id","files_verified","mismatches","missing"]}
                return {"path":path,"status":response.status,"data":data}
            except Exception as error:return {"path":path,"error":str(error)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:
            results=list(pool.map(check,paths))
          for result in results:print(json.dumps(result,ensure_ascii=False))
          source=next(result for result in results if result["path"]=="/health/source-exclusion")
          data=source.get("data",{})
          assert data.get("status")=="ok" and data.get("remaining_cases")==0 and data.get("remaining_records")==0,source
          assert (data.get("cleanup") or {}).get("status")=="completed",source
          print("TWFUNS_DELETION_AND_EXCLUSION_VERIFIED")
          PY

# Post-cleanup verification: JUDUN-1.2.107-190650E1A759
