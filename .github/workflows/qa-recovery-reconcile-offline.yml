name: QA recovery reconciliation offline only
on:
  push:
    branches: [ops/qa-recovery-reconcile-20261128]
permissions:
  contents: read
jobs:
  offline-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: |
          python3 -m py_compile ops/qa/reconcile_recovered_native_qa.py
          python3 -I -B ops/qa/reconcile_recovered_native_qa.py --self-test
          sha256sum ops/qa/reconcile_recovered_native_qa.py
