name: FATE ATLAS v3.13.1 verify deployed release
on:
  push:
    branches: [gh-pages]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fortune-atlas-pages
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release assets and all twelve engines
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          data=json.loads(Path('version.json').read_text())
          assert data['version']=='3.13.1'
          for name,sha in data['assets'].items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==sha,name
              if name.endswith('.webp'):
                  assert Path(name).stat().st_size>10000,name
                  assert Path(name).read_bytes()[:4]==b'RIFF',name
              if name.endswith('.svg'):
                  import xml.etree.ElementTree as ET
                  svg=ET.fromstring(Path(name).read_text())
                  assert svg.tag.endswith('svg') and 'viewBox' in svg.attrib,name
              if name.endswith('.png'):
                  blob=Path(name).read_bytes()
                  assert blob[:8]==b'\x89PNG\r\n\x1a\n',name
                  assert blob[25] in (4,6),'Expected alpha channel: '+name
          print('ALL_SOURCE_HASHES_PASS')
          PY
          node --check app.js
          node --check interpretation-engine.js
          node --check sky-engine.js
          node qa-engine.cjs
          node --check mystic-interactions.js
          node qa-mystic.cjs
      # The repository already publishes gh-pages through native Pages.
      # Keep one publisher; this job validates that exact live payload.
      - name: Wait for Pages and verify actual HTTPS asset hashes
        run: |
          python3 - <<'PY'
          import hashlib,json,time,urllib.request
          from pathlib import Path
          base='https://momopuke.github.io/judun-deploy/'
          expected=json.loads(Path('version.json').read_text())
          for attempt in range(16):
              try:
                  def fetch(name):
                      req=urllib.request.Request(base+name+'?v=3.13.1-'+str(attempt),headers={'User-Agent':'FateAtlas-Release-QA','Cache-Control':'no-cache'})
                      with urllib.request.urlopen(req,timeout=15) as r:
                          assert r.status==200
                          return r.read()
                  live=json.loads(fetch('version.json'))
                  assert live['version']=='3.13.1'
                  for name,sha in expected['assets'].items():
                      assert hashlib.sha256(fetch(name)).hexdigest()==sha,name
                  assert live['assets']==expected['assets']
                  print('LIVE_HTTPS_ALL_ASSETS_VERIFIED',base)
                  print('LIVE_VERSION',live['version'])
                  break
              except Exception as e:
                  print('RETRY',attempt+1,repr(e))
                  if attempt==15:raise
                  time.sleep(5)
          PY
      - name: Build complete reproducible release ZIP
        run: |
          git archive --format=zip --output=FATE-ATLAS_v3.13.1_FULL.zip HEAD
          unzip -t FATE-ATLAS_v3.13.1_FULL.zip | tail -2
      - name: Store verified full-source release artifact
        uses: actions/upload-artifact@v4
        with:
          name: FATE-ATLAS-v3.13.1-full-source
          path: FATE-ATLAS_v3.13.1_FULL.zip
          if-no-files-found: error
          retention-days: 90
