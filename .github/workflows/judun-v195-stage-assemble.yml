name: Judun v195 encrypted staging candidate assembly
on:
  push:
    branches:
      - stage/v195-transfer-20261127-36c9920d2bab
permissions:
  contents: write
jobs:
  assemble-stage-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Verify exact CMS chunks and original Ed25519 signature
        run: python3 stage-transfer/v195/assemble.py
      - name: Publish immutable signed stage-only candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE=ff0d53979e95c2bb5a6bbad9eb38cae4473b1f46
          BRANCH=stage/v195-candidate-20261127-36c9920d2bab
          git fetch --no-tags origin refs/heads/main --depth=1
          test "$(git rev-parse FETCH_HEAD)" = "$BASE"
          if git ls-remote --exit-code --heads origin "refs/heads/$BRANCH" >/dev/null; then
            echo 'STOP:JUDUN_CANDIDATE_BRANCH_ALREADY_EXISTS'
            exit 1
          fi
          git switch --detach "$BASE"
          git switch -c "$BRANCH"
          mkdir -p staging
          cp "$RUNNER_TEMP/candidate.cms" staging/candidate.cms
          cp "$RUNNER_TEMP/candidate.json" staging/candidate.json
          cp "$RUNNER_TEMP/candidate.json.sig.b64" staging/candidate.json.sig.b64
          test "$(sha256sum staging/candidate.cms | cut -d' ' -f1)" = 48c79afd71da3d29f3c45455b7541093b3eb4252020b91f6d3a355ba5c4198a3
          git add staging/candidate.cms staging/candidate.json staging/candidate.json.sig.b64
          git -c user.name='judun-stage-ci' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Prepare v1.2.195 immutable signed encrypted staging candidate'
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "JUDUN_V195_SIGNED_STAGE_CANDIDATE_PUSH_PASS $(git rev-parse HEAD)"
