name: JUDUN read-only release recovery preflight
on:
  push:
    paths:
      - '.github/workflows/v141-recovery-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect deployed manifest and running app
        run: |
          python3 - <<'PY'
          import urllib.request,json,time
          url='https://judun.142-93-91-214.sslip.io/health/build'
          for attempt in range(3):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'Cache-Control':'no-cache'}),timeout=20) as r:
                      j=json.load(r)
                  print('READ_ONLY_RELEASE_STATE',json.dumps({k:j.get(k) for k in ('version','artifact_id','source_tree_sha256','build_instance_id','manifest_status')},sort_keys=True),flush=True)
                  break
              except Exception as e:
                  print('RETRY',type(e).__name__,flush=True)
                  time.sleep(3)
          else:raise RuntimeError('Live build not reachable')
          PY
