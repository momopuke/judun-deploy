name: FATE ATLAS static site publish
on:
  push:
    branches: [gh-pages]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: fortune-atlas-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify isolated site payload
        shell: bash
        run: |
          test -s index.html
          test -s version.json
          test -f .nojekyll
          test ! -e channel
          test ! -e keys
          test ! -e releases
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          html = Path('index.html').read_bytes()
          data = json.loads(Path('version.json').read_text())
          assert hashlib.sha256(html).hexdigest() == data['sha256_index_html']
          assert data['version'] == '1.3.0'
          assert hashlib.sha256(Path('engines-v1.2.0.js').read_bytes()).hexdigest() == data['sha256_engine']
          print('FATE_ATLAS_SOURCE_INTEGRITY_PASS')
          PY
      - name: Fetch audited fixed-version Ziwei engine
        shell: bash
        run: |
          curl -fLSs --retry 3 -o iztro-v2.6.5.min.js 'https://cdn.jsdelivr.net/npm/iztro@2.6.5/dist/iztro-v2.6.5.min.js'
          echo '6d7993c30d76b4720ccd6c981893738e1c5d3d8c925115ea910c1a161c41882b  iztro-v2.6.5.min.js' | sha256sum -c -
          node - <<'NODE'
          global.self=global;
          global.iztro=require('./iztro-v2.6.5.min.js');
          global.crypto=require('node:crypto').webcrypto;
          const e=require('./engines-v1.2.0.js');
          const z=e.ziweiBirth('1990-01-01','12:20','male','Asia/Taipei');
          if(z.status!=='ok'||z.palaces.length!==12||z.stars!==14)throw Error('Ziwei sample mismatch');
          if(e.palaceCount!==64||e.DECK.length!==78)throw Error('Engine integrity failure');
          console.log('FATE_ENGINES_DEPLOY_PASS');
          NODE
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy only FATE ATLAS website
        id: deploy
        uses: actions/deploy-pages@v4
      - name: Verify public HTTPS site and exact published version
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, time, urllib.request
          from pathlib import Path
          base = 'https://momopuke.github.io/judun-deploy/'
          local = Path('index.html').read_bytes()
          expected_hash = hashlib.sha256(local).hexdigest()
          last_error = None
          for attempt in range(18):
              try:
                  def fetch(path):
                      req = urllib.request.Request(base + path, headers={
                          'User-Agent': 'FateAtlas-Live-Verification/1',
                          'Cache-Control': 'no-cache'
                      })
                      with urllib.request.urlopen(req, timeout=12) as response:
                          assert response.status == 200
                          return response.read()
                  remote = fetch('index.html?v=' + str(attempt))
                  manifest = json.loads(fetch('version.json?v=' + str(attempt)))
                  assert hashlib.sha256(remote).hexdigest() == expected_hash, 'Online HTML SHA mismatch'
                  assert manifest['sha256_index_html'] == expected_hash, 'Manifest SHA mismatch'
                  assert 'window.__fortuneTest' in remote.decode('utf-8')
                  assert 'shareReport' in remote.decode('utf-8')
                  assert manifest['version'] == '1.3.0'
                  assert hashlib.sha256(fetch('engines-v1.2.0.js?v=' + str(attempt))).hexdigest() == manifest['sha256_engine'], 'Online engine SHA mismatch'
                  assert hashlib.sha256(fetch('iztro-v2.6.5.min.js?v=' + str(attempt))).hexdigest() == manifest['vendor']['sha256'], 'Online Ziwei vendor SHA mismatch'
                  print('LIVE_HTTPS_VERIFIED', base)
                  print('LIVE_VERSION', manifest['version'])
                  print('LIVE_INDEX_SHA256', expected_hash)
                  break
              except Exception as exc:
                  last_error = repr(exc)
                  print('LIVE_CHECK_RETRY', attempt + 1, last_error)
                  if attempt == 17:
                      raise SystemExit('LIVE_HTTPS_VERIFICATION_FAILED: ' + last_error)
                  time.sleep(5)
          PY
