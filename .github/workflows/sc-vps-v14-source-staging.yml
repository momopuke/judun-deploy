name: SC VPS v14 staged source and 5x offline tests
on:
  push:
    branches: [vps-maintenance]
    paths:
      - 'vps-maintenance/autodeploy/staging/v14-source.gz.b64'
      - 'vps-maintenance/autodeploy/staging/v14-test.gz.b64'
      - '.github/workflows/sc-vps-v14-source-staging.yml'
permissions:
  contents: write
jobs:
  materialize-v14:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: SHA256 pinned source extraction and five offline test rounds
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,gzip,hashlib,pathlib
          root=pathlib.Path('vps-maintenance/autodeploy')
          release=root/'releases'/'SC-VPS-v14-20261104-d1'
          artifacts={
            'v14-source.gz.b64':('SC_VPS_Rescue_v14.py','79ef1aaef2a68f5167640bc71581f58a3ab97df58a260f5e0add133669d9a908'),
            'v14-test.gz.b64':('tests/test_v14.py','0f9f014dedee5f24ba100b092ac5558e541963e0c47d6a3ffac56c2584438154'),
          }
          for name,(dest,expected) in artifacts.items():
              raw=gzip.decompress(base64.b64decode((root/'staging'/name).read_text().strip(),validate=True))
              if dest=='SC_VPS_Rescue_v14.py':
                  assert hashlib.sha256(raw).hexdigest()=='590f796d0906f4e085c71e71993e7a93044dac1379d8e0227a271409328cf375'
                  old=b's.st_uid==0'
                  assert raw.count(old)==1
                  raw=raw.replace(old,b's.st_uid==os.geteuid()')
                  assert raw.count(b'fs.st_uid!=0')==1
                  raw=raw.replace(b'fs.st_uid!=0',b'fs.st_uid!=os.geteuid()')
              assert len(raw)<30000 and hashlib.sha256(raw).hexdigest()==expected,dest
              out=release/dest;out.parent.mkdir(parents=True,exist_ok=True);out.write_bytes(raw)
              print('STAGED_SHA256_OK',dest)
          PY
          python3 -m py_compile vps-maintenance/autodeploy/releases/SC-VPS-v14-20261104-d1/SC_VPS_Rescue_v14.py
          cd vps-maintenance/autodeploy/releases/SC-VPS-v14-20261104-d1
          for i in 1 2 3 4 5; do
            python3 -m unittest discover -s tests -p test_v14.py -q
            echo "V14_TEST_ROUND_$i=PASS"
          done
      - name: Commit reviewed and verified v14 source into signed-release directory
        shell: bash
        run: |
          set -euo pipefail
          git config user.name scvps-staging-bot
          git config user.email scvps-staging-bot@users.noreply.github.com
          git add vps-maintenance/autodeploy/releases/SC-VPS-v14-20261104-d1
          if git diff --cached --quiet; then
            echo V14_SOURCE_ALREADY_COMMITTED
          else
            git commit -m 'SC VPS v14 verified retention source and 5x17 tests'
            git push origin HEAD:vps-maintenance
          fi
