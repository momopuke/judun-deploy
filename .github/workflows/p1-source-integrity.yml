name: JUDUN P0 evidence quality and optional live audit
on:
  push:
    paths:
      - "p1/**"
      - ".github/workflows/p1-source-integrity.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Test relevance, source privacy, comparability and progress cache
        run: python3 -m unittest discover -s p1 -p 'test_*.py' -v
  live-audit:
    # A failed production expansion status endpoint should NEVER be hammered on
    # every source edit. Manual bounded read-only inspection only.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Read-only public evidence health (may report timeout as failure)
        run: python3 p1/check_public_health.py
      - name: Save sanitized health evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: judun-source-trust-health
          path: p1/results/*.json
          if-no-files-found: ignore
          retention-days: 14
