name: Verify JUDUN v1.2.86 live

on:
  push:
    paths:
      - ".github/workflows/verify-v1286-live.yml"
      - "channel/stable.json"
      - "channel/stable.json.sig.b64"
      - "releases/v1.2.86-source-links-keyword-r3-20261005.cms.b64"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Verify signed release channel
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json
          from pathlib import Path
          m=json.loads(Path("channel/stable.json").read_text())
          assert m["release_id"]=="v1.2.86-source-links-keyword-r3-20261005",m
          assert m["base_artifact_id"]=="JUDUN-1.2.85-19A955700B55",m
          assert m["target_artifact_id"]=="JUDUN-1.2.86-6A3F2D92C8E1",m
          raw=base64.b64decode("".join(Path(m["payload_path"]).read_text().split()))
          got=hashlib.sha256(raw).hexdigest()
          assert got==m["payload_sha256"],(got,m["payload_sha256"])
          print("SIGNED_CHANNEL_PAYLOAD_SHA_PASS")
          PY
          base64 -d channel/stable.json.sig.b64 > /tmp/stable.sig
          openssl pkeyutl -verify -pubin -inkey keys/release_signing_public.pem -rawin -in channel/stable.json -sigfile /tmp/stable.sig
          echo "SIGNED_RELEASE_VERIFY_PASS"

      - name: Wait for AutoDeploy and verify production
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://judun.142-93-91-214.sslip.io"
          for i in $(seq 1 48); do
            echo "attempt=$i"
            if BUILD="$(curl -4 --http1.1 -kfsS --connect-timeout 5 --max-time 15 -H 'Cache-Control: no-cache' "$BASE/health/build?probe=$(date +%s)")"; then
              echo "$BUILD"
              VERSION="$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("display_version",""))' <<<"$BUILD" 2>/dev/null || true)"
              ARTIFACT="$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("artifact_id",""))' <<<"$BUILD" 2>/dev/null || true)"
              if [[ "$VERSION" == "v1.2.86" && "$ARTIFACT" == "JUDUN-1.2.86-6A3F2D92C8E1" ]]; then
                echo "LIVE_V1286_PASS"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "Production did not converge to v1.2.86 in time."
          exit 1
