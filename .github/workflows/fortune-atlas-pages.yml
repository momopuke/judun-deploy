name: FATE ATLAS v3.4 publish and verify
on:
  push:
    branches: [gh-pages]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: fortune-atlas-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate release assets and all twelve engines
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          data=json.loads(Path('version.json').read_text())
          assert data['version']=='3.4.0'
          for name,sha in data['assets'].items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==sha,name
              if name.endswith('.webp'):
                  assert Path(name).stat().st_size>10000,name
                  assert Path(name).read_bytes()[:4]==b'RIFF',name
          print('ALL_SOURCE_HASHES_PASS')
          PY
          node --check app.js
          node --check interpretation-engine.js
          node --check sky-engine.js
          node qa-engine.cjs
      - name: Stage the exact static payload
        run: |
          python3 - <<'PY'
          import json,shutil
          from pathlib import Path
          target=Path('_site')
          target.mkdir()
          data=json.loads(Path('version.json').read_text())
          for name in [*data['assets'],'version.json']:
              (target/name).parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(name,target/name)
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy FATE ATLAS
        id: deploy
        uses: actions/deploy-pages@v4
      - name: Verify actual HTTPS asset hashes
        run: |
          python3 - <<'PY'
          import hashlib,json,time,urllib.request
          from pathlib import Path
          base='https://momopuke.github.io/judun-deploy/'
          expected=json.loads(Path('version.json').read_text())
          for attempt in range(16):
              try:
                  def fetch(name):
                      req=urllib.request.Request(base+name+'?v=3.4.0-'+str(attempt),headers={'User-Agent':'FateAtlas-Release-QA','Cache-Control':'no-cache'})
                      with urllib.request.urlopen(req,timeout=15) as r:
                          assert r.status==200
                          return r.read()
                  live=json.loads(fetch('version.json'))
                  assert live['version']=='3.4.0'
                  for name,sha in expected['assets'].items():
                      assert hashlib.sha256(fetch(name)).hexdigest()==sha,name
                  assert live['assets']==expected['assets']
                  print('LIVE_HTTPS_ALL_ASSETS_VERIFIED',base)
                  print('LIVE_VERSION',live['version'])
                  break
              except Exception as e:
                  print('RETRY',attempt+1,repr(e))
                  if attempt==15:raise
                  time.sleep(5)
          PY
