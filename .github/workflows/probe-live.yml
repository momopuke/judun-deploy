name: Verify live JUDUN home entrances
on:
  push:
    paths:
      - ".github/workflows/probe-live.yml"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify role entrances, live routes, artifact and preserved exclusion
        shell: bash
        run: |
          python3 - <<'PY'
          import json,time,urllib.request
          from html.parser import HTMLParser
          base="https://judun.142-93-91-214.sslip.io"
          def request(path):
              started=time.monotonic()
              with urllib.request.urlopen(urllib.request.Request(base+path,headers={"Cache-Control":"no-cache"}),timeout=40) as response:
                  body=response.read()
              return round(time.monotonic()-started,3),body
          class Home(HTMLParser):
              def __init__(self):super().__init__();self.cards=[];self.ids=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if "id" in a:self.ids.append(a["id"])
                  if "home109-card" in a.get("class","").split():self.cards.append(a.get("href"))
          seconds,body=request("/");home=body.decode();parser=Home();parser.feed(home)
          assert parser.cards==["#home-upload-panel","/matching/","#home-retrieve","/matching/?role=company"],parser.cards
          assert len(parser.ids)==len(set(parser.ids))
          assert "v1.2.110" in home and "裝修這一步" in home and "用專業，" not in home
          assert 'id="fileInput"' in home and 'id="dataConsentInput"' in home and 'id="parentJobIdInput"' in home
          print("HOME",json.dumps({"seconds":seconds,"cards":parser.cards,"unique_ids":len(parser.ids)},ensure_ascii=False))
          for path in ["/matching/","/matching/?role=company","/cooperation/","/static/home-entry-responsive-check.html"]:
              seconds,body=request(path);assert body
              print("ROUTE",path,seconds)
          seconds,body=request("/health/source-exclusion");excluded=json.loads(body)
          assert excluded.get("remaining_cases")==0 and excluded.get("remaining_records")==0
          print("EXCLUSION",json.dumps({key:excluded.get(key) for key in ["excluded_domains","remaining_cases","remaining_records"]},ensure_ascii=False))
          seconds,body=request("/health/build");build=json.loads(body)
          assert build.get("version")=="1.2.110" and build.get("artifact_id","").startswith("JUDUN-1.2.110-")
          seconds,body=request("/health/artifact?deep=true");deep=json.loads(body)
          assert deep.get("status")=="ok" and deep.get("artifact_id")==build["artifact_id"] and deep.get("files_verified")==79,deep
          seconds,body=request("/admin/data-expansion/api/status");status=json.loads(body)
          print("EXPANSION",json.dumps({"seconds":seconds,"running":status.get("running"),"task_id":(status.get("auto_goal") or {}).get("task_id"),"state":(status.get("auto_goal") or {}).get("status"),"rounds":(status.get("auto_goal") or {}).get("rounds_completed")},ensure_ascii=False))
          print("HOME_LIVE_VERIFY_PASS",json.dumps({"version":build["version"],"artifact_id":build["artifact_id"],"files_verified":deep["files_verified"],"role_entrances":4},ensure_ascii=False))
          PY
