name: Verify JUDUN signed release and production

on:
  push:
    paths:
      - ".github/workflows/verify-v1286-live.yml"
      - ".github/scripts/verify_release.py"
      - "channel/stable.json"
      - "channel/stable.json.sig.b64"
      - "releases/**"
  workflow_dispatch:

concurrency:
  group: judun-production-verification
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v5
      - name: Verify signed release channel and payload
        run: python3 .github/scripts/verify_release.py package
      - name: Verify production identity and all managed files
        run: python3 .github/scripts/verify_release.py live
      - name: Read-only live source identity for next signed delta
        run: |
          python3 - <<'PY'
          import json, urllib.request
          url='https://judun.142-93-91-214.sslip.io/health/build'
          request=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'JUDUN-v136-preflight/1'})
          with urllib.request.urlopen(request,timeout=30) as response:
              data=json.load(response)
          safe={key:data.get(key) for key in ('version','artifact_id','source_tree_sha256','build_instance_id','manifest_status')}
          print('LIVE_SOURCE_IDENTITY',json.dumps(safe,ensure_ascii=False,sort_keys=True))
          PY
      - name: Verify protected evidence, live progress route and mail availability
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error
          base='https://judun.142-93-91-214.sslip.io'
          def get(path):
              req=urllib.request.Request(base+path,headers={'Cache-Control':'no-cache','User-Agent':'JUDUN-v136-feature-qa/1'})
              return urllib.request.urlopen(req,timeout=30)
          with get('/') as r:
              home=r.read().decode('utf-8')
          assert 'judun-company-floating' in home, 'Fixed company CTA absent'
          assert '/status-lite/' in home and 'pollJudunCase' in home, 'Single-flight progress polling absent'
          assert '已處理 ' in home and ' 個分析步驟' in home, 'v140 homeowner progress wording missing'
          begin = 'window.resumeAnalysis = async function(btn, jobId) {'
          end = 'window.previewPackage = async function(jobId) {'
          assert home.count(begin) == 1 and home.count(end) == 1, 'Resume handler unavailable'
          resume = home.split(begin, 1)[1].split(end, 1)[0]
          assert 'timer = setTimeout(poll' in resume, 'Resume not using serialized polling'
          assert 'setInterval(' not in resume, 'Overlapping resume polling persists'
          print('V140_HOMEOWNER_PROGRESS_AND_RESUME_PASS')
          assert '查看公開報價證據庫' not in home, 'Private source navigation leaked'
          for path in ('/public-quote-evidence','/same-spec-inquiry','/admin/email-test','/admin/gmail-https-code'):
              try:
                  with get(path) as r:
                      raise AssertionError('Protected route unexpectedly accessible: '+path)
              except urllib.error.HTTPError as e:
                  assert e.code in (401,403), (path,e.code)
          try:
              with get('/status-lite/__judun_nonexistent__') as r:
                  raise AssertionError('Unknown case unexpectedly exists')
          except urllib.error.HTTPError as e:
              assert e.code in (404,410),e.code
          with get('/health/build') as r:
              health=json.load(r)
          assert health['version']==json.load(open('channel/stable.json'))['expected_display_version'].lstrip('v'), 'Live version mismatches signed channel'
          print('FEATURE_ACCESS_AND_POLL_PASS',{'fixed_company':True,'protected_routes':4,'light_status':True,'mail_delivery_enabled':health.get('mail_delivery_enabled')})
          PY
      - name: Verify non-existent PDF jobs are private
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error
          base='https://judun.142-93-91-214.sslip.io'
          unknown='0'*64
          routes=('/print-jobs/'+unknown, '/print-jobs/'+unknown+'/file', '/print-jobs/'+unknown+'/view')
          for route in routes:
              try:
                  with urllib.request.urlopen(urllib.request.Request(base+route,headers={'Cache-Control':'no-cache'}),timeout=20) as response:
                      raise AssertionError('Unowned PDF route unexpectedly succeeded: '+route)
              except urllib.error.HTTPError as e:
                  assert e.code in (401,403,404), (route,e.code)
          print('PDF_PRIVATE_MISSING_TASK_ROUTES_PASS',len(routes))
          PY
# v1.2.133 signed release final live-base verification 2026-10-23
